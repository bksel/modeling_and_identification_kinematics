name = "Planar 2R pendulum"
description = "Two revolute joints with parallel axes (z out of the plane); links of length a1 and a2 move in the x0-y0 plane."

joints = ["q1", "q2"]

[constants]
a1 = 1.0
a2 = 0.8

[sample]
q1 = "30*deg"
q2 = "45*deg"

[[dh]]
theta = "q1"
d = "0"
a = "a1"
alpha = "0"

[[dh]]
theta = "q2"
d = "0"
a = "a2"
alpha = "0"

[ik.intermediates]
D = "(x**2 + y**2 - a1**2 - a2**2) / (2*a1*a2)"

[[ik.solution]]
name = "Elbow branch q2 > 0"
q2 = "atan2(sqrt(1 - D**2), D)"
q1 = "atan2(y, x) - atan2(a2*sin(q2), a1 + a2*cos(q2))"

[[ik.solution]]
name = "Elbow branch q2 < 0"
q2 = "atan2(-sqrt(1 - D**2), D)"
q1 = "atan2(y, x) - atan2(a2*sin(q2), a1 + a2*cos(q2))"
